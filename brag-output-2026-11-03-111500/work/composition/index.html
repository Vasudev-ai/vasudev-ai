<script>
/* ==================================================================
   VASUDEV AI — AWAKENING INTELLIGENCE  |  every frame = f(t)
   90s · 1920x1080 · 30fps · no voiceover
   ================================================================== */
window.TL={total:90.0,frames:2700,fps:30,lines:[]};
const $ = id => document.getElementById(id);
const SC=['s1','s2','s3','s4','s5','s6'].map(id=>$(id));

/* chapter boundaries */
const B=[0,10,22,32,58.5,70,90.0];

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const outExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const inExpo=x=>x<=0?0:Math.pow(2,10*(x-1));
const outCubic=x=>1-Math.pow(1-x,3);
const inCubic=x=>x*x*x;
const outQuint=x=>1-Math.pow(1-x,5);
const inQuint=x=>x*x*x*x*x;
const outBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const inOutQuint=x=>x<.5?16*x*x*x*x*x:1-Math.pow(-2*x+2,5)/2;

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296}}

/* 128 BPM grid — drives every cut */
const BPM=128, BEAT=60/BPM;
function pulse(t){const p=(t%BEAT)/BEAT;return Math.pow(1-p,3.2)}
function accent(t){const b=Math.floor(t/BEAT)%4;const p=(t%BEAT)/BEAT;
  return b===0?Math.pow(1-p,4):Math.pow(1-p,3)*0.4}

function setText(el,txt){if(el._t!==txt){el.innerHTML=txt;el._t=txt}}

/* kinetic slam: scale down from big, de-blur, settle, optional whip-out */
function slam(el,t,inStart,inDur,holdEnd,outStart,outDur,scaleFrom){
  const a=seg(t,inStart,inStart+inDur);
  const b=outStart!=null?seg(t,outStart,outStart+outDur):0;
  if(t<inStart||(outStart!=null&&t>=outStart+outDur)){
    el.style.opacity=0;el.style.visibility='hidden';return false}
  el.style.visibility='visible';
  let op=clamp(a*1.35);
  if(b>0)op*=1-clamp(b);
  const e=outQuint(a);
  const sc=lerp(scaleFrom===undefined?1.42:scaleFrom,1,e);
  const blur=lerp(18,0,outCubic(a))+b*14;
  const ty=lerp(44,0,outQuint(a))-b*36;
  const tx=b*-80;
  el.style.opacity=op;
  el.style.transform=`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${sc.toFixed(4)})`;
  el.style.filter=blur>0.4?`blur(${blur.toFixed(2)}px)`:'none';
  return true;
}
function whip(el,t,start,dur,dirX,dirY){
  const a=seg(t,start,start+dur);
  if(t<start){el.style.opacity=0;el.style.visibility='hidden';return false}
  const e=outQuint(a);
  el.style.visibility='visible';
  el.style.opacity=clamp(a*2.2);
  el.style.transform=`translate(${lerp(dirX,0,e).toFixed(1)}px,${lerp(dirY,0,e).toFixed(1)}px)`;
  return true;
}
function hide(el){el.style.opacity=0;el.style.visibility='hidden'}

/* ---------------- canvas ---------------- */
const cv=$('bg'), cx=cv.getContext('2d');
const W=1920,H=1080;
const rnd=mulberry(20261103);
const STARS=[];for(let i=0;i<250;i++)STARS.push({x:rnd()*W,y:rnd()*H,z:rnd(),
  s:rnd()*1.9+.5,ph:rnd()*6.28,sp:rnd()*.7+.3});
const NODES=[];for(let i=0;i<48;i++)NODES.push({x:rnd()*W,y:rnd()*H,
  vx:(rnd()-.5)*26,vy:(rnd()-.5)*26,ph:rnd()*6.28});
const DUST=[];for(let i=0;i<130;i++)DUST.push({x:rnd()*W,y:rnd()*H,z:rnd(),
  s:rnd()*2.4+.6,ph:rnd()*6.28});

function sceneOf(t){let i=0;for(let k=0;k<B.length-1;k++)if(t>=B[k])i=k;return i}

function drawStars(t,alpha,col){
  cx.save();cx.globalCompositeOperation='lighter';
  for(const s of STARS){
    const tw=0.55+0.45*Math.sin(t*1.5*s.sp+s.ph);
    cx.fillStyle=`rgba(${col||'200,240,255'},${(0.16+0.5*s.z)*tw*alpha})`;
    cx.beginPath();cx.arc(s.x,s.y,s.s,0,6.28);cx.fill();
  }
  cx.restore();
}

function drawBG(t){
  const si=sceneOf(t), local=t-B[si], pl=pulse(t), ac=accent(t);
  cx.fillStyle='#05060A';cx.fillRect(0,0,W,H);

  if(si===0){                    /* AWAKENING — bass hit + speed streaks */
    const hit=Math.pow(1-clamp(t/1.1),2.2);
    const g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,940);
    g.addColorStop(0,`rgba(0,120,170,${0.06+0.30*hit+0.07*pl})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.save();cx.globalCompositeOperation='lighter';
    for(const s of STARS){
      const len=lerp(90,420,s.z)*(0.5+local*0.20);
      const x=((s.x-local*(1150+1150*s.z))%(W+700)+(W+700))%(W+700)-350;
      const gr=cx.createLinearGradient(x,s.y,x+len,s.y);
      gr.addColorStop(0,'rgba(0,229,255,0)');
      gr.addColorStop(.5,`rgba(0,229,255,${0.08+0.30*s.z+0.22*pl+0.35*hit})`);
      gr.addColorStop(1,'rgba(0,229,255,0)');
      cx.strokeStyle=gr;cx.lineWidth=s.s*0.9+0.4;
      cx.beginPath();cx.moveTo(x,s.y);cx.lineTo(x+len,s.y);cx.stroke();
    }
    cx.restore();
  }
  else if(si===1){               /* ENERGY — perspective grid + network */
    cx.save();
    const horizon=H*0.44, speed=local*1.35;
    cx.strokeStyle='rgba(0,229,255,0.20)';cx.lineWidth=1.4;
    for(let i=0;i<28;i++){
      const z=((i/28)+speed)%1;
      const y=horizon+(z*z)*(H-horizon)*2.0;
      cx.globalAlpha=clamp(z*1.7)*0.7;
      cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();
    }
    cx.globalAlpha=0.5;
    for(let i=-16;i<=16;i++){
      cx.beginPath();cx.moveTo(W/2+i*26,horizon);cx.lineTo(W/2+i*190,H+220);cx.stroke();
    }
    cx.restore();
    const g=cx.createRadialGradient(W/2,H*0.5,0,W/2,H*0.5,880);
    g.addColorStop(0,`rgba(0,85,125,${0.10+0.14*pl})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    drawStars(t,0.45);
  }
  else if(si===2){               /* REVEAL — particles converge, then hold */
    const conv=outCubic(seg(t,22,26.4));
    const cxp=W/2,cyp=H*0.44;
    const g=cx.createRadialGradient(cxp,cyp,0,cxp,cyp,1000);
    g.addColorStop(0,`rgba(0,150,195,${0.06+0.16*conv+0.10*pl})`);
    g.addColorStop(.55,`rgba(0,60,95,${0.06*conv})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.save();cx.globalCompositeOperation='lighter';
    for(const s of STARS){
      const ang=s.ph+local*0.30*s.sp;
      const rad=lerp(s.z*980+260,s.z*130+40,conv);
      const x=cxp+Math.cos(ang)*rad*1.5;
      const y=cyp+Math.sin(ang)*rad;
      const a=(0.10+0.42*s.z)*(0.45+0.75*pl+0.6*conv);
      cx.fillStyle=`rgba(0,229,255,${a})`;
      cx.beginPath();cx.arc(x,y,s.s*(1+conv*1.6),0,6.28);cx.fill();
    }
    cx.restore();
    if(conv>0.05){               /* energy rings outward after the logo hits */
      cx.save();cx.globalCompositeOperation='lighter';
      for(let k=0;k<4;k++){
        const rr=((t-26.4)*340+k*260)%1600;
        if(rr<0||rr>1500)continue;
        cx.strokeStyle=`rgba(0,229,255,${0.16*(1-rr/1500)})`;
        cx.lineWidth=2.4;
        cx.beginPath();cx.arc(cxp,cyp,rr,0,6.28);cx.stroke();
      }
      cx.restore();
    }

  else if(si===3){               /* ECOSYSTEM — equalizer + network */
    cx.save();
    const cols=68,bw=W/cols;
    for(let i=0;i<cols;i++){
      const n=0.5+0.5*Math.sin(i*0.62+local*4.4)*Math.sin(i*0.19-local*2.5);
      const h=(40+n*250)*(0.55+pl*0.75);
      const gr=cx.createLinearGradient(0,H,0,H-h);
      gr.addColorStop(0,'rgba(0,229,255,0.18)');
      gr.addColorStop(1,'rgba(0,229,255,0)');
      cx.fillStyle=gr;cx.fillRect(i*bw+2,H-h,bw-4,h);
    }
    cx.restore();
    drawStars(t,0.35);
    const g=cx.createRadialGradient(W/2,H*0.5,0,W/2,H*0.5,980);
    g.addColorStop(0,`rgba(0,70,110,${0.10+0.12*pl})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
  }
  else if(si===4){               /* PHILOSOPHY — gold bloom + rising motes */
    const g=cx.createRadialGradient(W/2,H*0.36,0,W/2,H*0.36,980);
    g.addColorStop(0,`rgba(150,105,20,${0.17+0.10*pl})`);
    g.addColorStop(.5,'rgba(90,60,10,0.09)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.save();cx.globalCompositeOperation='lighter';
    for(const s of STARS){
      const y=((s.y-local*64*s.sp)%(H+80)+(H+80))%(H+80)-40;
      const a=(0.14+0.34*s.z)*(0.6+pl*0.6);
      cx.fillStyle=`rgba(${s.z>.6?'255,197,61':'0,229,255'},${a})`;
      cx.beginPath();cx.arc(s.x,y,s.s*0.85,0,6.28);cx.fill();
    }
    cx.restore();
    /* the Sanskrit breaks into a network at 67.4 */
    const net=outCubic(seg(t,67.4,70));
    if(net>0.01){
      cx.save();cx.globalCompositeOperation='lighter';
      for(const d of DUST){
        const tx=W/2+(d.x-W/2)*0.32, ty=300+(d.y-300)*0.42;
        const x=lerp(d.x,tx,net), y=lerp(d.y,ty,net);
        cx.fillStyle=`rgba(0,229,255,${(0.08+0.32*d.z)*net})`;
        cx.beginPath();cx.arc(x,y,d.s*(1+net),0,6.28);cx.fill();
      }
      cx.restore();
    }
  }
  else{                          /* FINAL — energy field, then the drop */
    const cxp=W/2,cyp=H*0.40;
    const g=cx.createRadialGradient(cxp,cyp,0,cxp,cyp,1050);
    const k=clamp((t-70)/8);
    g.addColorStop(0,`rgba(0,140,180,${0.10*k+0.14*pl})`);
    g.addColorStop(.5,`rgba(0,60,100,${0.07*k})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.save();cx.globalCompositeOperation='lighter';
    const conv=clamp((t-70)/8.5);
    for(const s of STARS){
      const ang=s.ph+local*0.20*s.sp;
      const rad=lerp(s.z*900+240,s.z*180+70,conv);
      const x=cxp+Math.cos(ang)*rad*1.45;
      const y=cyp+Math.sin(ang)*rad;
      const a=(0.10+0.40*s.z)*(0.5+0.75*pl);
      cx.fillStyle=`rgba(0,229,255,${a})`;
      cx.beginPath();cx.arc(x,y,s.s*(1+conv*1.4),0,6.28);cx.fill();
    }
    cx.restore();
    if(t>=79){                    /* the drop: light erupts outward */
      const rr=(t-79)*760;
      if(rr<1700){
        cx.save();cx.globalCompositeOperation='lighter';
        const a=Math.max(0,0.5*(1-rr/1700));
        const gr=cx.createRadialGradient(cxp,cyp,rr*0.55,cxp,cyp,rr*1.05);
        gr.addColorStop(0,'rgba(0,229,255,0)');
        gr.addColorStop(.72,`rgba(0,229,255,${a*0.5})`);
        gr.addColorStop(1,'rgba(0,229,255,0)');
        cx.fillStyle=gr;cx.fillRect(0,0,W,H);
        cx.restore();
      }
    }
  }

  /* shared node network */
  if(si>=1&&si<=4){
    cx.save();cx.lineWidth=1;cx.strokeStyle='rgba(0,229,255,0.30)';
    for(let i=0;i<NODES.length;i++){
      const a=NODES[i];
      const ax=a.x+Math.sin(local*0.5+a.ph)*36+a.vx*local*0.4;
      const ay=a.y+Math.cos(local*0.45+a.ph)*36+a.vy*local*0.4;
      for(let j=i+1;j<NODES.length;j++){
        const b=NODES[j];

        const by=b.y+Math.cos(local*0.45+b.ph)*36+b.vy*local*0.4;
        const d=Math.hypot(ax-bx,ay-by);
        if(d<190){cx.globalAlpha=0.30*(1-d/190);
          cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(bx,by);cx.stroke()}
      }
      cx.globalAlpha=0.5;cx.fillStyle='rgba(0,229,255,0.75)';
      cx.beginPath();cx.arc(ax,ay,2.4,0,6.28);cx.fill();
    }
    cx.restore();
  }
}

  if(t<81.0){hide(shloka6)}
  else{
    const a=seg(t,81.0,82.0);
    shloka6.style.visibility='visible';
    shloka6.style.opacity=(clamp(a)*0.72).toFixed(3);
  }
  setText(ln6,'Building Intelligence. <span class="cyan">Empowering Innovation.</span>');
  if(t<82.2){hide(ln6)}
  else slam(ln6,t,82.2,0.40,null,null,null,1.24);
  if(t<84.3){hide(url6)}
  else{
    slam(url6,t,84.3,0.46,null,null,null,1.18);
    const g=0.5+0.5*pulse(t);
    url6.style.textShadow=`0 0 ${(18+28*g).toFixed(0)}px rgba(0,229,255,.8)`;
  }
  setText(ln6b,'The Next Wave Starts Here.');
  if(t<86.3){hide(ln6b)}
  else slam(ln6b,t,86.3,0.40,null,null,null,1.26);
}

/* ---------------------------------------------------------------- overlays */
const HITS=[[0,1.0],[2.2,.30],[5.3,.28],[10.0,.70],[22.0,1.0],[26.4,.85],[32.0,.55],
            [38.6,.42],[45.2,.42],[51.8,.45],[58.5,.45],[70.0,.70],[74.2,.42],[76.3,.42],
            [78.55,1.0],[79.0,.70],[82.2,.32]];
function flashAmt(t){
  let a=0;
  for(const h of HITS) if(t>=h[0]&&t<h[0]+0.40){
    const k=(t-h[0])/0.40; a=Math.max(a,h[1]*(1-k)*(1-k));}
  return a;
}
function blackAmt(t){
  let a=0;
  if(t>=22.00&&t<23.00) a=Math.max(a,t<22.14?1:1-seg(t,22.14,23.00));
  if(t>=78.55&&t<79.35) a=Math.max(a,t<78.70?1:1-seg(t,78.70,79.35));
  return a;
}

/* ---------------------------------------------------------------- camera */
const PBASE=[1.045,1.040,1.050,1.035,1.045,1.075];
function applyCam(si,t){
  const s=B[si],e=B[si+1],u=clamp((t-s)/(e-s));
  const el=SC[si];
  let tx=Math.sin(u*3.1)*9,ty=Math.cos(u*2.3)*6;
  let sc=lerp(1,PBASE[si],u),bl=0;
  if(si>0&&t<s+0.18){
    const w=outQuint(seg(t,s,s+0.18));
    tx+=lerp(-230,0,w);sc*=lerp(1.17,1,w);bl=lerp(12,0,w);
  }
  el.style.transform=`translate(${tx.toFixed(2)}px,${ty.toFixed(2)}px) scale(${sc.toFixed(4)})`;
  el.style.filter=bl>0.3?`blur(${bl.toFixed(2)}px)`:'none';
}

/* ---------------------------------------------------------------- seek */
function seek(t){
  t=Math.max(0,Math.min(90,+t||0));
  drawBG(t);
  const si=sceneOf(t);
  for(let k=0;k<SC.length;k++){
    if(k===si){SC[k].style.visibility='visible';SC[k].style.opacity='1';}
    else{SC[k].style.visibility='hidden';SC[k].style.opacity='0';
         SC[k].style.transform='';SC[k].style.filter='';}
  }
  applyCam(si,t);
  if(si===0)animS1(t);else if(si===1)animS2(t);else if(si===2)animS3(t);
  else if(si===3)animS4(t);else if(si===4)animS5(t);else animS6(t);
  flashEl.style.opacity=(flashAmt(t)*0.62).toFixed(3);
  blackEl.style.opacity=blackAmt(t).toFixed(3);
  cv.style.opacity=(1-seg(t,88.6,90.0)).toFixed(3);
}
window.seek=seek;

function boot(){seek(0);window.__ready=true;}
const fontsReady=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
if(document.readyState==='complete') fontsReady.then(boot);
else window.addEventListener('load',()=>fontsReady.then(boot));
</script>
